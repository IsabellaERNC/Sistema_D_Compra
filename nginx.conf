# ============================================
# NGINX GATEWAY - Sistema D Compra
# ============================================
# Expone http://localhost:8080/api/{servicio}/*
# como único punto de entrada para el frontend.
#
# CUSTOMIZAR: cambiar puertos si algún servicio
# corre en puerto diferente (ej: auth:4001 en vez de 4000)
# ============================================

events {
    worker_connections 1024;
}

http {

    # ============================================
    # UPSTREAMS - Servicios internos
    # ============================================
    upstream auth {
        server auth:4000;
    }
    upstream catalogo {
        server catalogo:4001;
    }
    upstream pagos {
        server pagos:4002;
    }
    upstream notificaciones {
        server notificaciones:4003;
    }
    upstream envios {
        server envios:4004;
    }
    upstream carrito {
        server carrito:3000;
    }

    server {
        listen 80;

        # --------------------------------------------
        # AUTH
        # --------------------------------------------
        location /api/auth/ {
            proxy_pass http://auth/;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # --------------------------------------------
        # CATÁLOGO / PRODUCTOS
        # --------------------------------------------
        location /api/catalogo/ {
            proxy_pass http://catalogo/;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        # --------------------------------------------
        # PAGOS
        # --------------------------------------------
        location /api/pagos/ {
            proxy_pass http://pagos/;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        # --------------------------------------------
        # NOTIFICACIONES
        # --------------------------------------------
        location /api/notificaciones/ {
            proxy_pass http://notificaciones/;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        # --------------------------------------------
        # ENVÍOS
        # --------------------------------------------
        location /api/envios/ {
            proxy_pass http://envios/;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        # --------------------------------------------
        # CARRITO (tu microservicio)
        # --------------------------------------------
        location /api/carrito/ {
            proxy_pass http://carrito/;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # --------------------------------------------
        # WEBHOOK PAGOS -> CARRITO
        # (ruta pública para que pagos notifique)
        # --------------------------------------------
        location /api/carrito/webhook/ {
            proxy_pass http://carrito/webhook/;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # --------------------------------------------
        # WEBSOCKET - Pedidos
        # --------------------------------------------
        location /socket.io/ {
            proxy_pass http://carrito/socket.io/;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }
    }
}
