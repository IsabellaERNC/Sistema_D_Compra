<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mis Pedidos — Sistema D Compra</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background: #f5f5f5; color: #333; }
        .container { max-width: 900px; margin: 0 auto; padding: 20px; }
        h1 { font-size: 1.5em; margin-bottom: 20px; color: #333; }
        .back-link { display: inline-block; margin-bottom: 16px; color: #007bff; text-decoration: none; font-size: 0.9em; }
        .back-link:hover { text-decoration: underline; }

        /* Badges de estado */
        .badge {
            display: inline-block;
            padding: 4px 10px;
            border-radius: 12px;
            font-size: 0.75em;
            font-weight: 600;
            text-transform: uppercase;
        }
        .badge-pending { background: #fff3cd; color: #856404; border: 1px solid #ffc107; }
        .badge-processing { background: #cfe2ff; color: #084298; border: 1px solid #0d6efd; }
        .badge-shipped { background: #fff3e0; color: #e65100; border: 1px solid #fd7e14; }
        .badge-delivered { background: #d1e7dd; color: #0f5132; border: 1px solid #198754; }
        .badge-cancelled { background: #f8d7da; color: #842029; border: 1px solid #dc3545; }

        .pedido-card {
            background: #fff;
            border-radius: 8px;
            box-shadow: 0 1px 4px rgba(0,0,0,0.1);
            margin-bottom: 12px;
            overflow: hidden;
        }
        .pedido-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 16px 20px;
            cursor: pointer;
            transition: background 0.2s;
        }
        .pedido-header:hover { background: #f8f9fa; }
        .pedido-info { display: flex; flex-direction: column; gap: 4px; }
        .pedido-id { font-weight: 600; font-size: 0.9em; color: #333; }
        .pedido-fecha { font-size: 0.8em; color: #666; }
        .pedido-right { display: flex; align-items: center; gap: 12px; }
        .pedido-total { font-weight: 700; color: #333; }
        .pedido-items-count { font-size: 0.8em; color: #666; }
        .expand-icon { font-size: 0.7em; color: #999; transition: transform 0.2s; }

        .pedido-detalle {
            border-top: 1px solid #eee;
            padding: 16px 20px;
            background: #fafafa;
        }
        .detalle-items h4 { font-size: 0.85em; color: #666; margin-bottom: 10px; text-transform: uppercase; letter-spacing: 0.5px; }
        .item-row { display: flex; justify-content: space-between; padding: 6px 0; border-bottom: 1px solid #f0f0f0; }
        .item-row:last-child { border-bottom: none; }
        .item-nombre { flex: 1; color: #333; }
        .item-cantidad { color: #666; margin: 0 12px; }
        .item-precio { font-weight: 500; color: #333; }
        .detalle-total { display: flex; justify-content: flex-end; gap: 8px; padding: 12px 0; border-bottom: 1px solid #e0e0e0; margin-bottom: 12px; font-size: 1.1em; }

        .pedidos-vacio { text-align: center; padding: 60px 20px; color: #666; }
        .pedidos-vacio p { font-size: 1.1em; margin-bottom: 16px; }
        .pedidos-vacio .btn { background: #007bff; color: #fff; padding: 10px 24px; border-radius: 6px; text-decoration: none; display: inline-block; }

        .btn { padding: 8px 16px; border-radius: 4px; border: none; cursor: pointer; font-size: 0.9em; }
        .btn-secondary { background: #6c757d; color: #fff; }
        .btn-secondary:hover { background: #5a6268; }

        .loading { text-align: center; padding: 40px; color: #666; }
        .websocket-status { font-size: 0.75em; text-align: center; padding: 4px; background: #e9ecef; color: #666; }
        .ws-connected { background: #d1e7dd; color: #0f5132; }
    </style>
</head>
<body>
    <div class="container">
        <a href="index.html" class="back-link">← Volver al inicio</a>
        <h1>📦 Mis Pedidos</h1>
        <div id="ws-status" class="websocket-status"></div>
        <div id="pedidos-container">
            <div class="loading">Cargando pedidos...</div>
        </div>
    </div>

    <script src="https://cdn.socket.io/4.8.0/socket.io.min.js"></script>
    <script src="../js/auth.js"></script>
    <script src="../js/pedidos.js"></script>
    <script>
        const API_URL = window.API_URL || 'http://localhost:3000';
        const container = document.getElementById('pedidos-container');
        const wsStatus = document.getElementById('ws-status');

        // Verificar auth
        if (!isLoggedIn()) {
            window.location.href = 'login.html?redirect=pedidos';
        }

        // Cargar pedidos
        async function init() {
            try {
                const pedidos = await listarPedidos();
                renderPedidos(container, pedidos);

                // Conectar WebSocket para tracking en tiempo real
                if (typeof io !== 'undefined') {
                    connectWebSocket();
                    wsStatus.textContent = '● Recibiendo actualizaciones en tiempo real';
                    wsStatus.classList.add('ws-connected');
                }
            } catch (err) {
                container.innerHTML = '<div class="pedidos-vacio"><p>Error cargando pedidos. Intenta de nuevo.</p></div>';
            }
        }

        init();
    </script>
</body>
</html>
