<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Sistema de Compras</title>
    <link rel="stylesheet" href="../css/styles.css">
    <style>
        body {
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }
        .login-page-wrap {
            flex: 1;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 40px 20px;
        }
        .login-box {
            background: white;
            border-radius: 12px;
            padding: 36px;
            width: 100%;
            max-width: 420px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.12);
        }
        .login-box h2 {
            color: #2E4057;
            margin-bottom: 24px;
            font-size: 1.4rem;
            text-align: center;
        }
    </style>
</head>
<body>

    <header>
        <div class="nav-izq">
            <h1>🛒 Sistema de Compras</h1>
        </div>
        <div class="nav-der">
            <a href="../index.html" class="nav-link">🏠 Inicio</a>
            <div id="auth-nav-btn"></div>
        </div>
    </header>

    <div class="login-page-wrap">
        <div class="login-box" id="callback-container">
            <p style="text-align:center; font-size:1.1rem; color:#555;" id="callback-message">Procesando inicio de sesión...</p>
        </div>
    </div>

    <script src="../js/auth.js"></script>
<script>
    (function() {
        const params = new URLSearchParams(window.location.search);
        const token = params.get('token');

        const msgEl = document.getElementById('callback-message');

        if (token) {
            localStorage.setItem('token', token);
            if (typeof renderAuthNav === 'function') {
                renderAuthNav();
            }
            window.location.href = '../index.html';
        } else {
            if (msgEl) {
                msgEl.innerHTML = 'No se recibió token de autenticación. <a href="../index.html">Volver al inicio</a>';
            }
        }
    })();
</script>
</body>
</html>
